<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Study Portal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dark-theme">

  <!-- LOGIN PORTAL OVERLAY -->
  <div id="loginOverlay" class="login-overlay">
    <div class="login-card">
      <div class="brand">
        <i class="fa-solid fa-brain brand-icon"></i>
        <span>CaseStudy<span class="accent-text">AI</span></span>
      </div>
      <h2>Welcome back</h2>
      <p class="subtitle">Sign in to access your 10-level learning workspace</p>
      
      <form id="loginForm">
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="name@domain.com" value="demo@workspace.ai" required>
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" value="password123" required>
        </div>
        <button type="submit" class="btn-primary full-width">Continue to Workspace</button>
      </form>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="appContainer" class="app-container hidden">
    
    <!-- CHATGPT STYLE SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <i class="fa-solid fa-brain brand-icon"></i>
          <span>CaseStudy<span class="accent-text">AI</span></span>
        </div>
        <button id="logoutBtn" class="btn-icon" title="Log out"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>

      <div class="sidebar-progress">
        <div class="progress-info">
          <span>Overall Progress</span>
          <span id="progressPercent">10%</span>
        </div>
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill" style="width: 10%;"></div>
        </div>
      </div>

      <nav class="level-list" id="levelListNav">
        <!-- Dynamically generated levels 1-10 -->
      </nav>
    </aside>

    <!-- JENNI AI STYLE WORKSPACE -->
    <main class="workspace">
      
      <!-- TOP TOOLBAR -->
      <header class="top-toolbar">
        <div class="toolbar-left">
          <span class="breadcrumb" id="levelBreadcrumb">Level 1 of 10</span>
          <span class="badge" id="difficultyBadge">Beginner</span>
        </div>
        <div class="toolbar-right">
          <button id="prevBtn" class="btn-secondary btn-sm"><i class="fa-solid fa-chevron-left"></i> Prev</button>
          <button id="nextBtn" class="btn-secondary btn-sm">Next <i class="fa-solid fa-chevron-right"></i></button>
          <button id="completeBtn" class="btn-primary btn-sm"><i class="fa-solid fa-check"></i> Mark Complete</button>
        </div>
      </header>

      <!-- DOCUMENT CONTENT CANVAS -->
      <div class="content-canvas">
        
        <!-- TITLE BLOCK -->
        <section class="doc-header">
          <h1 id="caseTitle">Loading case study...</h1>
          <p class="doc-meta" id="caseDomain">Domain: Healthcare AI</p>
        </section>

        <!-- NAVIGATION TABS -->
        <nav class="doc-tabs">
          <button class="tab-btn active" data-tab="scenario"><i class="fa-solid fa-file-lines"></i> Case Scenario</button>
          <button class="tab-btn" data-tab="hints"><i class="fa-solid fa-lightbulb"></i> Hints & Clues</button>
          <button class="tab-btn" data-tab="explanation"><i class="fa-solid fa-graduation-cap"></i> Explanation</button>
          <button class="tab-btn" data-tab="studies"><i class="fa-solid fa-book-bookmark"></i> Related Literature</button>
        </nav>

        <!-- TAB CONTENT PANES -->
        <div class="tab-content">
          
          <!-- Scenario Tab -->
          <div id="tab-scenario" class="pane active">
            <div class="editor-paper" id="scenarioText">
              <!-- Case study narrative injects here -->
            </div>
          </div>

          <!-- Hints Tab -->
          <div id="tab-hints" class="pane">
            <div class="hints-grid" id="hintsContainer">
              <!-- Hints inject here -->
            </div>
          </div>

          <!-- Explanation Tab -->
          <div id="tab-explanation" class="pane">
            <div class="explanation-box" id="explanationText">
              <!-- Explanation injects here -->
            </div>
          </div>

          <!-- Related Studies Tab -->
          <div id="tab-studies" class="pane">
            <div class="studies-list" id="studiesContainer">
              <!-- Related academic studies inject here -->
            </div>
          </div>

        </div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
